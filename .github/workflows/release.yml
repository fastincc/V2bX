name: Build and Release

on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Build all 23 platforms instead of the default four (artifacts only)'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'fastincc-v*'
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'third_party/**'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:

  test-anytls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Core regression
        working-directory: third_party/sing-box
        run: GOEXPERIMENT=jsonv2 go test ./common/trustedproxy ./protocol/anytls ./common/uot
      - name: Device admission race regression
        run: GOEXPERIMENT=jsonv2 go test -race ./limiter ./api/panel -count=1
      - name: Automatic reliable mode regression
        run: GOEXPERIMENT=jsonv2 go test -race ./conf ./api/panel ./common/trafficbatch ./node -run 'Test(Reporting|Traffic|Automatic|Batch|Queue|Conf_Load)' -count=1 -timeout=120s
      - name: Device limit hot-update regression
        run: GOEXPERIMENT=jsonv2 go test -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" ./node -run TestDevice -count=1
      - name: V2bX integration
        run: GOEXPERIMENT=jsonv2 ANYTLS_LONG_STREAM_DURATION=30s ANYTLS_CLEANUP_REVIEW=1 go test -tags "sing with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" ./core/sing -run TestAnyTLS -count=1

  build:
    needs: test-anytls
    strategy:
      matrix:
        # Tags and PRs build four supported release targets. The full matrix is
        # available only through an explicit manual build; it does not publish.
        include: >-
          ${{ fromJSON(
            github.event_name == 'workflow_dispatch' && inputs.full_matrix &&
            '[{"goos":"windows","goarch":"amd64"},{"goos":"windows","goarch":"386"},{"goos":"freebsd","goarch":"amd64"},{"goos":"freebsd","goarch":"386"},{"goos":"linux","goarch":"amd64"},{"goos":"linux","goarch":"386"},{"goos":"darwin","goarch":"amd64"},{"goos":"darwin","goarch":"arm64"},{"goos":"linux","goarch":"arm","goarm":7},{"goos":"linux","goarch":"arm","goarm":6},{"goos":"linux","goarch":"arm","goarm":5},{"goos":"android","goarch":"arm64"},{"goos":"linux","goarch":"arm64"},{"goos":"linux","goarch":"riscv64"},{"goos":"linux","goarch":"mips64"},{"goos":"linux","goarch":"mips64le"},{"goos":"linux","goarch":"mipsle"},{"goos":"linux","goarch":"mips"},{"goos":"linux","goarch":"ppc64"},{"goos":"linux","goarch":"ppc64le"},{"goos":"freebsd","goarch":"arm64"},{"goos":"freebsd","goarch":"arm","goarm":7},{"goos":"linux","goarch":"s390x"}]' ||
            '[{"goos":"linux","goarch":"amd64"},{"goos":"linux","goarch":"arm64"},{"goos":"linux","goarch":"arm","goarm":7},{"goos":"windows","goarch":"amd64"}]'
          ) }}
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
      - name: Show workflow information
        id: get_filename
        run: |
          export _NAME=$(jq ".[\"$GOOS-$GOARCH$GOARM$GOMIPS\"].friendlyName" -r < .github/build/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, GOMIPS: $GOMIPS, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Get project dependencies
        run: |
          go mod download
      - name: Get release version
        if: startsWith(github.ref, 'refs/tags/fastincc-v')
        run: |
          echo "version=$(echo $GITHUB_REF | cut -d / -f 3)" >> $GITHUB_ENV
      - name: Get other version
        if: ${{ !startsWith(github.ref, 'refs/tags/fastincc-v') }}
        run: |
          echo "version=${{ github.sha }}" >> $GITHUB_ENV
      - name: Build V2bX
        run: |
          echo "version: $version"
          mkdir -p build_assets
          GOEXPERIMENT=jsonv2 go build -v -o build_assets/V2bX -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -ldflags "-X 'github.com/InazumaV/V2bX/cmd.version=$version' -s -w -buildid="

      - name: Build Mips softfloat V2bX
        if: matrix.goarch == 'mips' || matrix.goarch == 'mipsle'
        run: |
          echo "version: $version"
          GOEXPERIMENT=jsonv2 GOMIPS=softfloat go build -v -o build_assets/V2bX_softfloat -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -ldflags "-X 'github.com/InazumaV/V2bX/cmd.version=$version' -s -w -buildid="
      - name: Rename Windows V2bX
        if: matrix.goos == 'windows'
        run: |
          cd ./build_assets || exit 1
          mv V2bX V2bX.exe
      - name: Prepare to release
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE
          cp ${GITHUB_WORKSPACE}/third_party/sing-box/LICENSE ./build_assets/LICENSE.sing-box
          cp ${GITHUB_WORKSPACE}/third_party/sing-anytls/LICENSE ./build_assets/LICENSE.sing-anytls
          cp ${GITHUB_WORKSPACE}/docs/ANYTLS.md ./build_assets/ANYTLS.md
          cp ${GITHUB_WORKSPACE}/docs/BUILD-CANDIDATE-20261029.md ./build_assets/BUILD-CANDIDATE.md
          cp ${GITHUB_WORKSPACE}/docs/RELEASE-0.4.1-10.md ./build_assets/RELEASE-NOTES.md
          cp ${GITHUB_WORKSPACE}/docs/REPORTING-STATUS.md ./build_assets/REPORTING-STATUS.md
          cp ${GITHUB_WORKSPACE}/docs/TRAFFIC-AUTO-MODE.md ./build_assets/TRAFFIC-AUTO-MODE.md
          cp ${GITHUB_WORKSPACE}/docs/TRAFFIC-BOUNDARY-CONTRACT.md ./build_assets/TRAFFIC-BOUNDARY-CONTRACT.md
          cp ${GITHUB_WORKSPACE}/example/*.json ./build_assets/
          LIST=('geoip' 'geosite')
          for i in "${LIST[@]}"
          do
            DOWNLOAD_URL="https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/${i}.dat"
            FILE_NAME="${i}.dat"
            echo -e "Downloading ${DOWNLOAD_URL}..."
            curl --fail --show-error --location --retry 3 "${DOWNLOAD_URL}" -o ./build_assets/${FILE_NAME}
          done
      - name: Create ZIP archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../V2bX-$ASSET_NAME.zip .
          popd || exit 1
          FILE=./V2bX-$ASSET_NAME.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done
      - name: Change the name
        run: |
          mv build_assets V2bX-$ASSET_NAME
      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V2bX-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: |
            ./V2bX-${{ steps.get_filename.outputs.ASSET_NAME }}/*
      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: ./V2bX-${{ steps.get_filename.outputs.ASSET_NAME }}.zip*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fastincc-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified build set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --notes-file docs/RELEASE-0.4.1-10.md
